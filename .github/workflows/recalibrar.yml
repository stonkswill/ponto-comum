name: Recalibração semanal

on:
  schedule:
    - cron: '17 9 * * 1'   # segunda, 06:17 em São Paulo (depois da rodada e das fontes externas)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  recalibrar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar variações com trava
        run: node ferramentas/recalibrar.mjs
      - name: Gravar no repositório
        run: |
          git config user.name "ponto-comum-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/modelo
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -q -m "Recalibração semanal $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          exit 1

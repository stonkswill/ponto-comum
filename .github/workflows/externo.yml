name: Fontes externas

on:
  schedule:
    - cron: '41 7 * * 1,4'   # segunda e quinta, 04:41 em São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ferramentas/externo.mjs', '.github/workflows/externo.yml']

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  externo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baixar fontes externas
        run: node ferramentas/externo.mjs
      - name: Gravar no repositório
        run: |
          git config user.name "ponto-comum-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/externo
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -q -m "Fontes externas $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          exit 1
